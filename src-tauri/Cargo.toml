[package]
name = "catcut"
version = "0.1.0"
description = "CatCut - Lightweight AI Video Editor"
authors = ["Marc"]
edition = "2021"

[lib]
name = "catcut_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
catcut-core = { path = "../crates/catcut-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
tauri = { version = "2.0", features = [] }
